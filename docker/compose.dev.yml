# docker/compose.dev.yml（11 §5）：开发态只起数据库两服务；app 由 bun dev 本地跑
services:
  postgres:
    image: postgres:18-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkbase}
      POSTGRES_DB: ${POSTGRES_DB:-linkbase}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-linkbase} -d ${POSTGRES_DB:-linkbase}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev: {}
  redisdata_dev: {}
