# docker/compose.e2e.yml（11 §5）：e2e 全栈（端口错开，避免与开发态冲突）
services:
  app:
    build: { context: .., dockerfile: docker/app.Dockerfile }
    ports:
      - '3101:3001'
    environment:
      DATABASE_URL: postgresql://linkbase:linkbase@postgres:5432/linkbase
      REDIS_URL: redis://redis:6379
      JWT_SECRET: e2e-secret-0123456789abcdef0123456789abcdef
      APP_ORIGIN: http://localhost:3101
      FRONTEND_URL: http://localhost:3101
      PORT: '3001'
      LOG_LEVEL: warn
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: linkbase
      POSTGRES_PASSWORD: linkbase
      POSTGRES_DB: linkbase
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkbase -d linkbase']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
